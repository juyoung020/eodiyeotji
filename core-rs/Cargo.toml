# 상위 폴더(예: 사용자 홈)에 빈 Cargo.toml이 있어도 작업 공간을 위로 찾지 않게 한다 (11/15 리허설 빌드가 이것 때문에 실패)
[workspace]

[package]
name = "eodi-core"
version = "0.6.0"
edition = "2021"
description = "어디였지 앱의 네이티브 코어: 경로 처리, 머문 곳 감지, 코스 분할"

[lib]
crate-type = ["lib", "cdylib"]
name = "eodi_core"

[dependencies]
uniffi = "0.32"
thiserror = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# 기억 에이전트(src/agent): OpenAI 호환 LLM 서버(개발: llama.cpp llama-server) HTTP 호출·JSON.
# LLM은 중계 서버(https, server/relay → 개발 PC의 Qwen)로도 부른다 → ureq "tls"(rustls). 같은 PC의 http도 그대로 된다.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
serde_json = "1"
# 차 → 폰 넘기기(src/handoff.rs): 카드 묶기 · 암호화 · 페어링 코드 · QR
serde = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
# 차 → 폰 기록 동기화 묶음 압축 (src/sync.rs)
miniz_oxide = "0.8"

[features]
# Kotlin 바인딩 생성기(호스트에서만 실행). 앱에 들어가는 .so에는 포함되지 않는다.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
