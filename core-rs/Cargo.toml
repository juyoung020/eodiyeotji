[package]
name = "eodi-core"
version = "0.6.0"
edition = "2021"
description = "어디였지 앱의 네이티브 코어: 경로 처리, 머문 곳 감지, 코스 분할"

[lib]
crate-type = ["lib", "cdylib"]
name = "eodi_core"

[dependencies]
uniffi = "0.32"
thiserror = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# 기억 에이전트(src/agent): OpenAI 호환 LLM 서버(개발: llama.cpp llama-server) HTTP 호출·JSON.
# 로컬 서버는 평문 http라 TLS를 빼서 작게 둔다. 출시용 https 서버를 쓰려면 ureq의 "tls" 기능을 켠다.
ureq = { version = "2.12", default-features = false }
serde_json = "1"
# 차 → 폰 넘기기(src/handoff.rs): 카드 묶기 · 암호화 · 페어링 코드 · QR
serde = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
# 차 → 폰 기록 동기화 묶음 압축 (src/sync.rs)
miniz_oxide = "0.8"

[features]
# Kotlin 바인딩 생성기(호스트에서만 실행). 앱에 들어가는 .so에는 포함되지 않는다.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
