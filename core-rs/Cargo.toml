[package]
name = "eodi-core"
version = "0.1.0"
edition = "2021"
description = "어디였지 앱의 네이티브 코어: 경로 처리, 머문 곳 감지, 코스 분할"

[lib]
crate-type = ["lib", "cdylib"]
name = "eodi_core"

[dependencies]
uniffi = "0.32"
thiserror = "2"

[features]
# Kotlin 바인딩 생성기(호스트에서만 실행). 앱에 들어가는 .so에는 포함되지 않는다.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
