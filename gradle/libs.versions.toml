[versions]
agp = "8.8.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
jna = "5.15.0"
pleosFusedLocation = "1.1.3"
pleosNaviHelper = "3.0.5"
pleosSpeech = "3.3.1"
# 13.1부터는 Kotlin 2.2로 빌드돼서 우리 Kotlin 2.0 컴파일러가 못 읽는다 → Kotlin 2.0 계열 마지막 판 (pmtiles:// 지원)
maplibre = "13.0.2"
coil = "2.7.0"
junit = "4.13.2"
orgJson = "20240303"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# Pleos Connect FusedLocation SDK (차량 위치)
pleos-fusedlocation = { group = "ai.pleos.playground", name = "FusedLocation", version.ref = "pleosFusedLocation" }
# Pleos Connect NaviHelper SDK (차량 내비 목적지·경유지 이름)
pleos-navihelper = { group = "ai.pleos.playground", name = "NaviHelper", version.ref = "pleosNaviHelper" }
# Pleos Connect SpeechToText SDK (운전 중 말로 묻기 — 차량 마이크·차량 음성 인식 엔진)
pleos-stt = { group = "ai.pleos.playground", name = "SpeechToText", version.ref = "pleosSpeech" }
# Pleos Connect TextToSpeech SDK (운전 중 답 읽어 주기 — 차량 음성 합성·오디오 시스템)
pleos-tts = { group = "ai.pleos.playground", name = "TextToSpeech", version.ref = "pleosSpeech" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
# 지도 그리기 (C++ GPU 벡터 렌더러). 오프라인 PMTiles 파일을 pmtiles://file:// 로 읽는다
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }
# 들른 곳 대표 사진(구글 Places) 이미지 불러오기·디스크 캐시
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
# UniFFI가 만든 Kotlin 바인딩이 Rust 라이브러리를 부를 때 쓴다 (Android용은 aar)
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
# JVM 단위 테스트 (Android의 org.json은 단위 테스트에서 빈 껍데기라 실제 구현을 넣는다)
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
